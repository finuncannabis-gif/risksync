<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>RS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css"/>
<style>
body{margin:0;padding:16px;background:#080d18;color:#dde4f0;font-family:monospace;font-size:12px}
.ok{color:#0ed27a}.err{color:#f04060}.hi{color:#2d7ef7}
</style>
</head>
<body>
<div id="root">
  <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#080d18;display:flex;align-items:center;justify-content:center;font-family:monospace;flex-direction:column;gap:16px">
    <div style="width:44px;height:44px;border-radius:11px;background:#2d7ef7;display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v10l9 5 9-5V7L12 2z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
    <div style="color:#dde4f0;font-size:15px;font-weight:700;letter-spacing:.5px">RiskSync</div>
    <div style="color:#5a6f96;font-size:11px">Loading intelligence platform...</div>
  </div>
</div>

<script>
/* RiskSync loader */
window._rsStatus = function(msg){
  var el = document.getElementById('load-status');
  if(el) el.textContent = msg;
};
window._rsErr = function(msg){
  document.getElementById('root').innerHTML =
    '<div style="color:#f04060;padding:28px;font-family:monospace;font-size:13px;background:#1e0810;border-radius:10px;margin:20px;border:1px solid #f04060">' +
    '<b>RiskSync failed to load:</b><br/><br/>' + msg + '</div>';
};
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

<script type="text/jsxcode" id="c1">
const {useState,useEffect,useCallback,useRef}=React;

function Chip({label,color,bg,small}){
  return <span style={{fontSize:small?9:10,fontWeight:700,padding:small?"1px 5px":"2px 8px",borderRadius:3,background:bg||(color+"22"),color,border:`1px solid ${color}44`,letterSpacing:.3,whiteSpace:"nowrap",display:"inline-block"}}>{label}</span>;
}

function SevChip({score,small}){return <Chip label={sevOf(score)} color={sevColor(score)} bg={sevBg(score)} small={small}/>;}

function Ring({score,size=80}){
  const r=size*.37,cx=size/2,cy=size/2,sw=size*.09;
  const circ=2*Math.PI*r,pct=Math.min(score/10,1),col=sevColor(score);
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.border} strokeWidth={sw}/>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round"
        strokeDasharray={`${pct*circ} ${circ}`} strokeDashoffset={circ*.25}
        style={{transition:"stroke-dasharray .9s cubic-bezier(.4,0,.2,1)"}}/>
      <text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle" fontSize={size*.19} fontWeight="800" fill={col}>{score.toFixed(1)}</text>
    </svg>
  );
}

function Bar({value,max=10,color,height=5}){
  return(
    <div style={{height,background:C.border,borderRadius:3,overflow:"hidden"}}>
      <div style={{width:`${Math.min(100,(value/max)*100)}%`,height:"100%",background:color,borderRadius:3,transition:"width .6s ease"}}/>
    </div>
  );
}

function HeatCell({cat,score}){
  const col=sevColor(score),bg=sevBg(score);
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
      <div style={{width:52,height:52,borderRadius:10,background:bg,border:`1.5px solid ${col}55`,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:2}}>
        <span style={{fontSize:12,color:col,fontWeight:800}}>{score.toFixed(1)}</span>
        <div style={{width:28,height:3,background:C.border,borderRadius:2,overflow:"hidden"}}>
          <div style={{width:`${Math.min(100,score*10)}%`,height:"100%",background:col,borderRadius:2}}/>
        </div>
      </div>
      <span style={{fontSize:9,color:C.muted,textAlign:"center",lineHeight:1.2,maxWidth:60}}>{cat.short}</span>
    </div>
  );
}

function NavBtn({icon,label,active,onClick}){
  return(
    <button onClick={onClick} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 12px",borderRadius:7,border:"none",background:active?C.accentBg:"transparent",color:active?C.accent:C.muted,cursor:"pointer",width:"100%",textAlign:"left"}}>
      <i className={`ti ${icon}`} style={{fontSize:15,flexShrink:0}}/>
      <span style={{fontSize:12,fontWeight:active?600:400}}>{label}</span>
    </button>
  );
}

/* ── ONBOARDING ── */
</script>
<script type="text/jsxcode" id="c2">
function Onboarding({onComplete}){
  const [step,setStep]=useState(0);
  const [p,setP]=useState({
    industry:null,scale:null,geo:null,
    techPillars:[],vendors:{},
    sources:["cisa","cve","epss","ghsa","osv"]
  });

  const toggle=(key,val)=>setP(prev=>({
    ...prev,
    [key]:prev[key].includes(val)?prev[key].filter(x=>x!==val):[...prev[key],val]
  }));

  /* 3 steps: 0=Welcome, 1=Profile (industry+scale+region+stack), 2=Sources */
  const steps=["Welcome","Your Profile","Review"];
  /* Step 1 valid when all 4 core fields are set */
  const canNext=[true, !!(p.industry&&p.scale&&p.geo&&p.techPillars.length>0), true];
  const [vendorText,setVendorText]=useState("");
  const cycleVendor=name=>setP(prev=>{const cur=prev.vendors[name]||0;const next={...prev.vendors};if(cur===2)delete next[name];else next[name]=cur+1;return {...prev,vendors:next};});
  const addVendor=()=>{const n=vendorText.trim();if(n.length<2)return;setP(prev=>({...prev,vendors:{...prev.vendors,[n]:prev.vendors[n]||1}}));setVendorText("");};
  const vendorStats=(()=>{const seen=new Set();let match=0,crit=0,nv=0,nc=0;VENDOR_PILLARS.forEach(g=>{if(!p.techPillars.includes(g.id))return;g.vendors.forEach(([name,n])=>{const lv=p.vendors[name];if(lv&&!seen.has(name)){seen.add(name);match+=n;nv++;if(lv===2){crit+=n;nc++;}}});});return {match,crit,nv,nc};})();
  const listedVendors=new Set(VENDOR_PILLARS.flatMap(g=>g.vendors.map(v=>v[0])));
  const customVendors=Object.keys(p.vendors).filter(n=>!listedVendors.has(n));
  const completeness=Math.round([p.industry,p.scale,p.geo,p.techPillars.length>0,Object.keys(p.vendors).length>0].filter(Boolean).length/5*100);

  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>

      {/* ── Top bar ── */}
      <div style={{padding:"14px 32px",borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,borderRadius:8,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <i className="ti ti-shield-lock" style={{fontSize:15,color:"#fff"}}/>
          </div>
          <div>
            <div style={{fontSize:14,fontWeight:800,color:C.text}}>RiskSync</div>
            <div style={{fontSize:9,color:C.muted,letterSpacing:.5}}>Micro-GRC · 2026</div>
          </div>
        </div>
        {/* Step dots */}
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {steps.map((s,i)=>(
            <React.Fragment key={s}>
              <div style={{display:"flex",alignItems:"center",gap:5}}>
                <div style={{width:22,height:22,borderRadius:"50%",background:i<step?C.green:i===step?C.accent:C.border,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:i<=step?"#fff":C.muted,transition:"all .3s"}}>
                  {i<step?"✓":i+1}
                </div>
                <span style={{fontSize:11,color:i===step?C.text:C.muted,fontWeight:i===step?600:400}}>{s}</span>
              </div>
              {i<steps.length-1&&<div style={{width:24,height:1,background:i<step?C.green:C.border}}/>}
            </React.Fragment>
          ))}
        </div>
        <div style={{width:120}}/>
      </div>

      {/* ── Content ── */}
      <div style={{flex:1,overflowY:"auto",padding:"28px 32px 32px"}}>

        {/* ══ STEP 0 — WELCOME ══ */}
        {step===0&&(
          <div className="fadein" style={{maxWidth:640,margin:"0 auto"}}>
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:24}}>
              <div style={{width:60,height:60,borderRadius:14,background:C.accentBg,border:`1px solid ${C.accent}50`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <i className="ti ti-shield-lock" style={{fontSize:28,color:C.accent}}/>
              </div>
              <div>
                <div style={{fontSize:26,fontWeight:900,color:C.text,letterSpacing:-.5}}>RiskSync</div>
                <div style={{fontSize:12,color:C.muted}}>Micro-GRC · Intelligence Platform · 2026</div>
              </div>
            </div>
            <div style={{fontSize:15,fontWeight:700,color:C.text,marginBottom:8}}>Your threat intelligence, personalised.</div>
            <p style={{fontSize:13,color:C.muted,lineHeight:1.8,marginBottom:24}}>
              Tell us your sector, the platforms you run and the vendors you use. We take the vulnerabilities CISA confirms are being exploited and rank them for your organisation with CISA's SSVC decision tree: <strong style={{color:C.text}}>Act</strong>, <strong style={{color:C.text}}>Attend</strong>, <strong style={{color:C.text}}>Track*</strong> or <strong style={{color:C.text}}>Track</strong>.
            </p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
              {[
                {icon:"ti-building",    label:"Your sector",   desc:"Sets the public well-being impact of a compromise, one input to CISA's decision tree"},
                {icon:"ti-server",      label:"Your stack",    desc:"The platforms and vendors you run decide what applies. Products you do not run are ranked last"},
                {icon:"ti-satellite",   label:"5 live sources", desc:"CISA KEV, the CVE List with CISA's SSVC values, EPSS, GitHub Advisories and OSV.dev"},
              ].map(f=>(
                <div key={f.label} style={{padding:"16px 14px",background:C.card,border:`1px solid ${C.border}`,borderRadius:10}}>
                  <i className={`ti ${f.icon}`} style={{fontSize:22,color:C.accent,display:"block",marginBottom:8}}/>
                  <div style={{fontSize:12,fontWeight:600,color:C.text,marginBottom:4}}>{f.label}</div>
                  <div style={{fontSize:11,color:C.muted,lineHeight:1.5}}>{f.desc}</div>
                </div>
              ))}
            </div>
            <div style={{padding:"10px 14px",background:C.card,borderRadius:7,border:`1px solid ${C.border}`,fontSize:11,color:C.muted,marginBottom:28}}>
              🔒 <strong style={{color:C.text}}>Your profile stays in this browser tab.</strong> Nothing is sent unless you subscribe to the bulletin, and then only your email, sector and chosen frequency.
            </div>
          </div>
        )}

        {/* ══ STEP 1 — COMBINED PROFILE FORM ══ */}
        {step===1&&(
          <div className="fadein">
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Set your profile</div>
              <div style={{fontSize:20,fontWeight:800,color:C.text,marginBottom:4}}>Tell us about your organisation</div>
              <div style={{fontSize:12,color:C.muted}}>All four inputs are required. Your selections drive every score and ranking in RiskSync.</div>
            </div>

            {/* Progress bar across 4 fields */}
            <div style={{display:"flex",gap:4,marginBottom:20}}>
              {[
                {label:"Industry",  done:!!p.industry},
                {label:"Scale",     done:!!p.scale},
                {label:"Region",    done:!!p.geo},
                {label:"Tech stack",done:p.techPillars.length>0},
              ].map((f,i)=>(
                <div key={f.label} style={{flex:1}}>
                  <div style={{height:3,borderRadius:2,background:f.done?C.green:C.border,marginBottom:4,transition:"background .3s"}}/>
                  <div style={{fontSize:9,color:f.done?C.green:C.muted,fontWeight:f.done?700:400}}>{f.done?"✓ ":""}{f.label}</div>
                </div>
              ))}
            </div>

            {/* ── 4-section form ── */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>

              {/* INDUSTRY */}
              <div style={{background:C.card,border:`1px solid ${p.industry?C.green+"60":C.border}`,borderRadius:12,padding:"14px 16px",transition:"border .2s"}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12}}>
                  <i className="ti ti-building" style={{fontSize:14,color:C.accent}}/>
                  <span style={{fontSize:13,fontWeight:700,color:C.text}}>Industry</span>
                  {p.industry&&<span style={{marginLeft:"auto",fontSize:10,color:C.green,fontWeight:700}}>✓ {INDUSTRIES.find(i=>i.id===p.industry)?.label}</span>}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,maxHeight:280,overflowY:"auto"}}>
                  {INDUSTRIES.map(ind=>(
                    <button key={ind.id} onClick={()=>setP(prev=>({...prev,industry:ind.id}))}
                      style={{display:"flex",alignItems:"center",gap:7,padding:"8px 10px",border:`1px solid ${p.industry===ind.id?ind.color:C.border}`,borderRadius:7,background:p.industry===ind.id?ind.color+"18":C.bg,cursor:"pointer",textAlign:"left",transition:"all .12s"}}>
                      <span style={{fontSize:18,flexShrink:0}}>{ind.icon}</span>
                      <div style={{minWidth:0}}>
                        <div style={{fontSize:10,fontWeight:600,color:p.industry===ind.id?ind.color:C.text,lineHeight:1.3}}>{ind.label}</div>
                        <div style={{fontSize:9,color:C.dim,marginTop:1}}>{ssvcWellBeing({industry:ind.id,techPillars:[]}).level==="material"?"Safety or essential services":"Limited public impact"}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              {/* SCALE + REGION stacked */}
              <div style={{display:"flex",flexDirection:"column",gap:14}}>

                {/* SCALE */}
                <div style={{background:C.card,border:`1px solid ${p.scale?C.green+"60":C.border}`,borderRadius:12,padding:"14px 16px",flex:1,transition:"border .2s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
                    <i className="ti ti-users" style={{fontSize:14,color:C.purple}}/>
                    <span style={{fontSize:13,fontWeight:700,color:C.text}}>Organisation scale</span>
                    {p.scale&&<span style={{marginLeft:"auto",fontSize:10,color:C.green,fontWeight:700}}>✓ {SCALES.find(s=>s.id===p.scale)?.label}</span>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {SCALES.map(sc=>(
                      <button key={sc.id} onClick={()=>setP(prev=>({...prev,scale:sc.id}))}
                        style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",border:`1px solid ${p.scale===sc.id?C.purple:C.border}`,borderRadius:7,background:p.scale===sc.id?C.purpleBg:C.bg,cursor:"pointer",textAlign:"left",transition:"all .12s"}}>
                        <div>
                          <div style={{fontSize:11,fontWeight:600,color:p.scale===sc.id?C.purple:C.text}}>{sc.label}</div>
                          <div style={{fontSize:10,color:C.muted}}>{sc.range} employees</div>
                        </div>
                        
                      </button>
                    ))}
                  </div>
                </div>

                {/* REGION */}
                <div style={{background:C.card,border:`1px solid ${p.geo?C.green+"60":C.border}`,borderRadius:12,padding:"14px 16px",flex:1,transition:"border .2s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
                    <i className="ti ti-map-pin" style={{fontSize:14,color:C.cyan}}/>
                    <span style={{fontSize:13,fontWeight:700,color:C.text}}>Primary region</span>
                    {p.geo&&<span style={{marginLeft:"auto",fontSize:10,color:C.green,fontWeight:700}}>✓ {GEOS.find(g=>g.id===p.geo)?.label}</span>}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
                    {GEOS.map(g=>(
                      <button key={g.id} onClick={()=>setP(prev=>({...prev,geo:g.id}))}
                        style={{padding:"8px 10px",border:`1px solid ${p.geo===g.id?C.cyan:C.border}`,borderRadius:7,background:p.geo===g.id?C.cyanBg:C.bg,cursor:"pointer",textAlign:"left",transition:"all .12s"}}>
                        <div style={{fontSize:11,fontWeight:600,color:p.geo===g.id?C.cyan:C.text,marginBottom:2}}>{g.label}</div>
                        <div style={{fontSize:9,color:C.muted,lineHeight:1.3}}>{g.reg.split("·")[0].trim()}</div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* TECH STACK — full width below */}
            <div style={{marginTop:14,background:C.card,border:`1px solid ${p.techPillars.length>0?C.green+"60":C.border}`,borderRadius:12,padding:"14px 16px",transition:"border .2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
                <i className="ti ti-server" style={{fontSize:14,color:C.amber}}/>
                <span style={{fontSize:13,fontWeight:700,color:C.text}}>Technology stack</span>
                <span style={{fontSize:11,color:C.muted,marginLeft:4}}>— select all that apply</span>
                {p.techPillars.length>0&&<span style={{marginLeft:"auto",fontSize:10,color:C.green,fontWeight:700}}>✓ {p.techPillars.length} selected</span>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:7}}>
                {TECH_PILLARS.map(t=>{
                  const sel=p.techPillars.includes(t.id);
                  return(
                    <button key={t.id} onClick={()=>toggle("techPillars",t.id)}
                      style={{display:"flex",alignItems:"center",gap:8,padding:"9px 11px",border:`1px solid ${sel?C.amber:C.border}`,borderRadius:8,background:sel?C.amberBg:C.bg,cursor:"pointer",textAlign:"left",transition:"all .12s"}}>
                      <span style={{fontSize:18,flexShrink:0}}>{t.icon}</span>
                      <div>
                        <div style={{fontSize:11,fontWeight:sel?600:400,color:sel?C.amber:C.text}}>{t.label}</div>
                      </div>
                      {sel&&<div style={{marginLeft:"auto",width:14,height:14,borderRadius:3,background:C.amber,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        <i className="ti ti-check" style={{fontSize:9,color:"#000"}}/>
                      </div>}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* VENDORS — which vendors run on the chosen platforms. Tap once: in use. Tap twice: business-critical. */}
            {p.techPillars.length>0&&(
              <div style={{marginTop:10,padding:"12px 14px",background:C.card,borderRadius:8,border:`1px solid ${Object.keys(p.vendors).length>0?C.green+"60":C.border}`}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,flexWrap:"wrap"}}>
                  <i className="ti ti-building-store" style={{fontSize:14,color:C.amber}}/>
                  <span style={{fontSize:12,fontWeight:700,color:C.text}}>Vendors you run</span>
                  <span style={{fontSize:10,color:C.muted}}>optional, but it sharpens every ranking</span>
                </div>
                <div style={{fontSize:10,color:C.dim,marginBottom:8}}>Tap once: in use. Tap twice: business-critical. Tap again: clear. The number is how many CISA-confirmed exploited vulnerabilities that vendor has.</div>
                {VENDOR_PILLARS.filter(g=>p.techPillars.includes(g.id)).map(g=>(
                  <div key={g.id} style={{marginBottom:8}}>
                    <div style={{fontSize:9,color:C.dim,marginBottom:4}}>{TECH_PILLARS.find(t=>t.id===g.id)?.label}</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {g.vendors.map(([name,n])=>{const lv=p.vendors[name]||0;return(
                        <button key={name} onClick={()=>cycleVendor(name)} style={{fontSize:10,padding:"4px 10px",borderRadius:6,cursor:"pointer",border:`1px solid ${lv===2?C.amber:lv===1?C.accent:C.border}`,background:lv===2?C.amberBg:lv===1?C.accentBg:C.bg,color:lv===2?C.amber:lv===1?C.accent:C.text}}>
                          {name} <span style={{opacity:.7}}>{n}</span>{lv===2&&<span style={{marginLeft:4,fontWeight:700}}>critical</span>}
                        </button>);})}
                    </div>
                  </div>
                ))}
                {customVendors.length>0&&(
                  <div style={{marginBottom:8}}>
                    <div style={{fontSize:9,color:C.dim,marginBottom:4}}>Added by you</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {customVendors.map(name=>{const lv=p.vendors[name]||0;return(
                        <button key={name} onClick={()=>cycleVendor(name)} style={{fontSize:10,padding:"4px 10px",borderRadius:6,cursor:"pointer",border:`1px solid ${lv===2?C.amber:C.accent}`,background:lv===2?C.amberBg:C.accentBg,color:lv===2?C.amber:C.accent}}>
                          {name}{lv===2&&<span style={{marginLeft:4,fontWeight:700}}>critical</span>}
                        </button>);})}
                    </div>
                  </div>
                )}
                <div style={{display:"flex",gap:6,marginTop:6}}>
                  <input value={vendorText} onChange={e=>setVendorText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addVendor();}} placeholder="Add another vendor" style={{flex:1,fontSize:11,padding:"6px 10px",borderRadius:6,border:`1px solid ${C.border}`,background:C.bg,color:C.text}}/>
                  <button onClick={addVendor} style={{fontSize:10,padding:"6px 12px",borderRadius:6,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,cursor:"pointer"}}>Add</button>
                </div>
                <div style={{marginTop:8,fontSize:10,color:vendorStats.nv>0?C.green:C.muted}}>
                  {vendorStats.nv>0?`${vendorStats.match.toLocaleString()} of 1,728 exploited vulnerabilities apply to your listed vendors (${Math.round(vendorStats.match/1728*100)}%)${vendorStats.nc>0?`, ${vendorStats.crit.toLocaleString()} on business-critical vendors`:""}. Everything else is ranked lower, not hidden.`:"Skip this and the app assumes unclassified products apply to you, and says so on every item."}
                </div>
              </div>
            )}
          </div>
        )}

        {/* ══ STEP 2 — REVIEW ══ */}
        {step===2&&(

        <td>

    </tr></table>
  </td></tr>

  ${sections.execSummary ? `
  <!-- EXEC SUMMARY -->
  <tr><td style=\"background:#080d18;border-left:1px solid #1a2540;border-right:1px solid #1a2540;padding:24px 28px;border-top:1px solid #1a2540\">
    <div style=\"font-size:9px;font-weight:700;color:#5a6f96;letter-spacing:1px;margin-bottom:10px\">EXECUTIVE SUMMARY</div>
    <div style=\"font-size:15px;font-weight:700;color:#fff;margin-bottom:10px;line-height:1.4\">
      Your ${ind?.label} organisation faces <span style=\"color:${col}\">${lbl.toLowerCase()}</span> cybersecurity exposure this week.
    </div>
    <div style=\"font-size:12px;color:#8a9bc0;line-height:1.8\">
      Based on ${(profile.sources||[]).length} active intelligence sources, <strong style=\"color:#dde4f0\">${kevHits.length} of your top 10 threats are actively exploited</strong> in the wild (CISA KEV confirmed). 
      Using the CISA SSVC decision tree with your sector and vendors, <strong>${S.act}</strong> items need action now and ${S.attend} need attention.
    </div>
    <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" style=\"margin-top:16px\">
      <tr>
        ${[
          {label:'Act now', val:String(S.act), col},
          {label:'KEV Confirmed', val:String(kevHits.length), col:'#f04060'},

          {label:'Critical Threats', val:String(top10.filter(v=>v.contextScore>=8).length), col:'#f04060'},

          <div style=\"font-size:9px;color:#5a6f96;margin-top:3px\">${k.label}</div>

    </table>
  </td></tr>` : ''}

  ${sections.kevAlert && kevHits.length > 0 ? `
  <!-- KEV ALERT -->
  <tr><td style=\"background:#1e0810;border:1px solid #f0406030;border-left:4px solid #f04060;padding:16px 28px;margin-top:0\">
    <div style=\"font-size:9px;font-weight:700;color:#f04060;letter-spacing:1px;margin-bottom:10px\">\u26a0 CISA KEV ALERT \u2014 ${kevHits.length} ACTIVELY EXPLOITED</div>
    <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\">
      ${kevRows}
    </table>
    <div style=\"font-size:10px;color:#f04060;margin-top:10px\">These vulnerabilities have confirmed real-world exploitation. Immediate patching required.</div>
  </td></tr>` : ''}

  ${sections.newSince && newSince.length > 0 ? `
  <!-- NEW SINCE YESTERDAY -->
  <tr><td style=\"background:#031419;border-left:1px solid #22d3ee40;border-right:1px solid #22d3ee40;border-top:1px solid #22d3ee30;padding:20px 28px\">
    <div style=\"font-size:9px;font-weight:700;color:#22d3ee;letter-spacing:1px;margin-bottom:10px\">\u25CF NEW SINCE YESTERDAY \u2014 ${newSince.length} PUBLISHED IN LAST 48H</div>
    <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\">
      ${newSinceRows}
    </table>
    <div style=\"font-size:10px;color:#5a6f96;margin-top:10px\">Ranked by recency, not risk score \u2014 review alongside your priority list below.</div>
  </td></tr>` : ''}

  ${sections.top5Threats ? `
  <!-- TOP 5 THREATS -->
  <tr><td style=\"background:#080d18;border-left:1px solid #1a2540;border-right:1px solid #1a2540;border-top:1px solid #1a2540;padding:24px 28px\">
    <div style=\"font-size:9px;font-weight:700;color:#5a6f96;letter-spacing:1px;margin-bottom:14px\">TOP 25 CONTEXTUAL THREATS \u2014 ${ind?.label?.toUpperCase()}</div>
    <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" style=\"border:1px solid #1a2540;border-radius:6px;overflow:hidden\">
      <tr style=\"background:#0c1220\">
        <td style=\"padding:8px 12px;font-size:9px;color:#5a6f96;font-weight:700\">#</td>
        <td style=\"padding:8px 12px;font-size:9px;color:#5a6f96;font-weight:700\">DESCRIPTION</td>
        <td style=\"padding:8px 12px;font-size:9px;color:#5a6f96;font-weight:700\">CVE</td>
        <td style=\"padding:8px 12px;font-size:9px;color:#5a6f96;font-weight:700;text-align:center\">SEVERITY</td>
        <td style=\"padding:8px 12px;font-size:9px;color:#5a6f96;font-weight:700;text-align:right\">SCORE</td>
      </tr>
      ${threatRows}
    </table>
  </td></tr>` : ''}

  ${sections.controlRec ? `
  <!-- CONTROL RECOMMENDATION -->
  <tr><td style=\"background:#0d1f3c;border-left:1px solid #2d7ef740;border-right:1px solid #2d7ef740;border-top:1px solid #2d7ef730;padding:20px 28px\">
    <div style=\"font-size:9px;font-weight:700;color:#2d7ef7;letter-spacing:1px;margin-bottom:10px\">THIS WEEK'S RECOMMENDED ACTION</div>
    <div style=\"font-size:13px;font-weight:700;color:#fff;margin-bottom:6px\">${topRem?.steps[0] || 'Review and patch all KEV-listed vulnerabilities within 14 days per CISA BOD 22-01.'}</div>
    <div style=\"font-size:11px;color:#8a9bc0;line-height:1.7\">${topRem?.urgency || 'Prioritise your top CISA KEV entries immediately.'}</div>
  </td></tr>` : ''}

  ${sections.regulatoryNote ? `
  <!-- REGULATORY NOTE -->
  <tr><td style=\"background:#080d18;border-left:1px solid #1a2540;border-right:1px solid #1a2540;border-top:1px solid #1a2540;padding:16px 28px\">
    <div style=\"font-size:9px;font-weight:700;color:#5a6f96;letter-spacing:1px;margin-bottom:8px\">REGULATORY CONTEXT \u00b7 ${geo?.label?.toUpperCase()}</div>
    <div style=\"font-size:11px;color:#8a9bc0;line-height:1.7\">${geo?.reg} \u2014 Organisations operating in ${geo?.label} must maintain compliance. ${kevHits.length > 0 ? (kevHits.length + " of this week's threats directly trigger mandatory notification obligations if exploited.") : 'No immediate notification triggers this week.'}</div>
  </td></tr>` : ''}

  <!-- FOOTER -->
  <tr><td style=\"background:#050c18;border:1px solid #1a2540;border-radius:0 0 10px 10px;border-top:none;padding:20px 28px\">
    <table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\"><tr>
      <td style=\"font-size:10px;color:#2e3f62;line-height:1.7\">
        <strong style=\"color:#5a6f96\">RiskSync</strong> \u00b7 Micro-GRC Intelligence Platform<br/>
        Ranked with the CISA SSVC decision tree using your sector and vendors<br/>
        Data sources: CISA KEV \u00b7 CVE List \u00b7 EPSS (FIRST.org) \u00b7 GitHub Advisories \u00b7 OSV.dev<br/>
        <span style=\"color:#1a2540\">You are receiving this because you configured a RiskSync bulletin subscription.</span>
      </td>
      <td align=\"right\" style=\"vertical-align:bottom\">
        <div style=\"font-size:20px;color:#1a2540;font-weight:700\">RS</div>
      </td>
    </tr></table>
  </td></tr>

</table>
</td></tr>
</table>
<style>

(function(){
  if(sessionStorage.getItem('rs_demo')==='Umlza1N5bmMyMDI2'){document.getElementById('rs-gate').style.display='none';return;}
  document.body.style.overflow='hidden';
})();
function rsUnlock(){
  if(btoa(document.getElementById('rs-pwd').value)==='Umlza1N5bmMyMDI2'){

    const handleBulletinSubscribe = () => {
      if (!email || !email.includes('@') || !email.includes('.')) {
        setSubError('Enter a valid email address.');
        return;
      }
      if (subscribed) { setSubscribed(false); setSubError(''); return; }
      setSubLoading(true); setSubError('');
      fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, industry: selectedIndustry, frequency, source: 'app-bulletin-sidebar' }),
      })
        .then(res => res.json())
        .then(data => {
          setSubLoading(false);
          if (data && data.ok) { setSubscribed(true); }
          else { setSubError((data && data.error) || 'Subscription failed — please try again.'); }
        })
        .catch(() => {
          setSubLoading(false);
          setSubError('Could not reach the subscription service — check your connection and try again.');
        });
    };

    const handleCopyHTML = () => {
    const html = generateEmail();
    navigator.clipboard.writeText(html).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  const handleDownloadHTML = () => {
    const html = generateEmail();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
    a.download = `RiskSync_DailyBrief_${new Date().toISOString().slice(0,10)}.html`;
    a.click();
  };

  const toggleSection = key => setSections(s => ({...s, [key]: !s[key]}));

  const SECTION_LABELS = {
    execSummary:'Daily Risk Summary', top5Threats:'Top 25 Threats',
    kevAlert:'KEV Alert Banner', controlRec:'Recommended Action',
    regulatoryNote:'Regulatory Note', newSince:'New Since Yesterday',
  };

  return (
    <div style={{display:'flex', height:'100%', overflow:'hidden'}}>

      {/* LEFT — Config panel */}

        <div style={{padding:'16px 18px', borderBottom:`1px solid ${C.border}`, flexShrink:0}}>
          <div style={{fontSize:11, fontWeight:700, color:'#fff', textTransform:'uppercase', letterSpacing:.8, marginBottom:2}}>Weekly Bulletin</div>
          <div style={{fontSize:10, color:C.muted}}>Configure and preview your daily threat brief</div>
        </div>

        <div style={{flex:1, overflowY:'auto', padding:'16px 18px'}}>

          {/* Industry Filter */}
          <div style={{marginBottom:20}}>
            <div style={{fontSize:9, fontWeight:700, color:C.muted, textTransform:'uppercase', letterSpacing:.8, marginBottom:10}}>Preview For Industry</div>
            <select value={selectedIndustry} onChange={e=>setSelectedIndustry(e.target.value)}
              style={{width:'100%', padding:'7px 10px', borderRadius:5, border:`1px solid ${C.accent}50`, background:C.card, color:C.text, fontSize:11, marginBottom:8, boxSizing:'border-box', cursor:'pointer'}}>
              {INDUSTRIES.map(i=>(
                <option key={i.id} value={i.id}>{i.icon} {i.label}</option>
              ))}
            </select>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:6}}>
              <select value={selectedScale} onChange={e=>setSelectedScale(e.target.value)}
                style={{padding:'6px 8px', borderRadius:5, border:`1px solid ${C.border}`, background:C.card, color:C.text, fontSize:10, cursor:'pointer', boxSizing:'border-box'}}>
                {SCALES.map(s=>(
                  <option key={s.id} value={s.id}>{s.label}</option>
                ))}
              </select>
              <select value={selectedGeo} onChange={e=>setSelectedGeo(e.target.value)}
                style={{padding:'6px 8px', borderRadius:5, border:`1px solid ${C.border}`, background:C.card, color:C.text, fontSize:10, cursor:'pointer', boxSizing:'border-box'}}>
                {GEOS.map(g=>(
                  <option key={g.id} value={g.id}>{g.label}</option>
                ))}
              </select>
            </div>
            {selectedIndustry !== profile.industry && (
              <div style={{marginTop:6, fontSize:9, color:C.amber}}>
                Previewing as {ind?.label} — your profile is {INDUSTRIES.find(i=>i.id===profile.industry)?.label}
              </div>
            )}
          </div>

          {/* Subscription */}
          <div style={{marginBottom:20}}>
            <div style={{fontSize:9, fontWeight:700, color:C.muted, textTransform:'uppercase', letterSpacing:.8, marginBottom:10}}>Subscription</div>
            <input
              type="email"
              value={email}
              onChange={e=>setEmail(e.target.value)}
              placeholder="your@email.com"
              style={{width:'100%', padding:'8px 10px', borderRadius:5, border:`1px solid ${subscribed?C.green:C.border}`, background:C.card, color:C.text, fontSize:11, marginBottom:8, boxSizing:'border-box'}}
            />
            <div style={{display:'flex', gap:6, marginBottom:10}}>
              {[['daily','Every Day'],['weekdays','Weekdays Only'],['critical','Critical Alerts Only']].map(([val,lbl2])=>(
                <button key={val} onClick={()=>setFrequency(val)}
                  style={{flex:1, padding:'5px 0', borderRadius:4, border:`1px solid ${frequency===val?C.accent:C.border}`, background:frequency===val?C.accentBg:'transparent', color:frequency===val?C.accent:C.muted, fontSize:10, cursor:'pointer'}}>
                  {lbl2}
                </button>
              ))}
            </div>
            <button
              onClick={handleBulletinSubscribe}
              disabled={subLoading}
              style={{width:'100%', padding:'9px', borderRadius:5, border:'none', background:subscribed?C.green:C.accent, color:subscribed?'#000':'#fff', fontSize:12, fontWeight:700, cursor:subLoading?'default':'pointer', opacity:subLoading?.7:1}}>
              {subLoading ? 'Subscribing...' : subscribed ? '✓ Subscribed — Click to Unsubscribe' : 'Subscribe to Bulletin'}
            </button>
            {subError && <div style={{fontSize:10, color:C.red, marginTop:6, textAlign:'center'}}>{subError}</div>}
            {subscribed && <div style={{fontSize:10, color:C.green, marginTop:6, textAlign:'center'}}>Next delivery: {frequency==='daily'?'Tomorrow 7:00 AM':frequency==='weekdays'?'Mon-Fri 7:00 AM':'On new KEV additions'}</div>}
          </div>

          {/* Sections toggle */}
          <div style={{marginBottom:20}}>
            <div style={{fontSize:9, fontWeight:700, color:C.muted, textTransform:'uppercase', letterSpacing:.8, marginBottom:10}}>Email Sections</div>
            {Object.entries(SECTION_LABELS).map(([key,label])=>(
              <div key={key} onClick={()=>toggleSection(key)}
                style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'8px 10px', marginBottom:5, background:C.card, borderRadius:5, cursor:'pointer', border:`1px solid ${sections[key]?C.accent+'40':C.border}`}}>
                <span style={{fontSize:11, color:sections[key]?C.text:C.muted}}>{label}</span>
                <div style={{width:30, height:16, borderRadius:8, background:sections[key]?C.accent:C.border, position:'relative', flexShrink:0, transition:'background .2s'}}>
                  <div style={{width:12, height:12, borderRadius:'50%', background:'#fff', position:'absolute', top:2, left:sections[key]?16:2, transition:'left .2s'}}/>
                </div>
              </div>
            ))}
          </div>

          {/* Schedule info */}
          <div style={{padding:'12px 14px', background:C.card, borderRadius:8, border:`1px solid ${C.border}`, marginBottom:16}}>
            <div style={{fontSize:9, fontWeight:700, color:C.muted, textTransform:'uppercase', letterSpacing:.8, marginBottom:8}}>Delivery Schedule</div>
            <div style={{fontSize:10, color:C.muted, lineHeight:1.8}}>
              Every <strong style={{color:C.text}}>7:00 AM UTC</strong> UTC<br/>
              Profile: <strong style={{color:ind?.color||C.accent}}>{ind?.label}</strong><br/>
              Sources: <strong style={{color:C.text}}>{(profile.sources||[]).length} active feeds</strong><br/>
              Format: <strong style={{color:C.text}}>HTML email</strong>
            </div>
          </div>

          {/* Setup note */}
          <div style={{padding:'10px 12px', background:C.amberBg, border:`1px solid ${C.amber}30`, borderRadius:6}}>
            <div style={{fontSize:9, fontWeight:700, color:C.amber, marginBottom:4}}>TO SEND AUTOMATICALLY</div>
            <div style={{fontSize:10, color:C.amber, lineHeight:1.6}}>Add Supabase + Resend integration for live delivery. Use the HTML export below to test in any email client now.</div>
          </div>
        </div>
      </div>

      {/* RIGHT — Preview */}
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>

        {/* Preview toolbar */}
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 20px', borderBottom:`1px solid ${C.border}`, background:C.surface, flexShrink:0}}>
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <div style={{width:8, height:8, borderRadius:'50%', background:C.red}}/>
            <div style={{width:8, height:8, borderRadius:'50%', background:C.amber}}/>
            <div style={{width:8, height:8, borderRadius:'50%', background:C.green}}/>
            <span style={{fontSize:11, color:C.muted, marginLeft:8}}>Daily Threat Brief — {weekStr}</span>
          </div>
          <div style={{display:'flex', gap:8}}>
            <button onClick={handleCopyHTML}
              style={{display:'flex', alignItems:'center', gap:6, padding:'6px 14px', borderRadius:5, border:`1px solid ${C.border}`, background:copied?C.greenBg:C.card, color:copied?C.green:C.muted, fontSize:11, cursor:'pointer'}}>
              <i className={`ti ${copied?'ti-check':'ti-copy'}`} style={{fontSize:12}}/>
              {copied?'Copied!':'Copy HTML'}
            </button>
            <button onClick={handleDownloadHTML}
              style={{display:'flex', alignItems:'center', gap:6, padding:'6px 14px', borderRadius:5, border:`1px solid ${C.accent}50`, background:C.accentBg, color:C.accent, fontSize:11, fontWeight:700, cursor:'pointer'}}>
              <i className="ti ti-download" style={{fontSize:12}}/>Download .html
            </button>
          </div>
        </div>

        {/* Email preview iframe-style */}
        <div style={{flex:1, overflow:'auto', padding:'20px', background:'#030810'}}>
          <div style={{maxWidth:640, margin:'0 auto'}}>

            {/* Header */}
            <div style={{background:'#080d18', border:'1px solid #1a2540', borderRadius:'10px 10px 0 0', padding:'24px 28px'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                <div>
                  <div style={{width:32, height:32, background:C.accent, borderRadius:7, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:10}}>
                    <i className="ti ti-shield-lock" style={{fontSize:15, color:'#fff'}}/>
                  </div>
                  <div style={{fontSize:18, fontWeight:700, color:'#fff', letterSpacing:.5}}>RISKSYNC</div>
                  <div style={{fontSize:9, color:C.muted, marginTop:2, letterSpacing:1}}>DAILY THREAT BRIEF · {weekStr.toUpperCase()}</div>

<script type="text/jsxcode" id="c6defs">
/* ── LIVE DATA ENGINE ── */
const CWE_TYPE_MAP = {
  "CWE-77":"injection","CWE-78":"injection","CWE-88":"injection","CWE-89":"injection",
  "CWE-79":"injection","CWE-94":"injection","CWE-611":"xxe","CWE-918":"api_abuse",
  "CWE-502":"deserialization","CWE-20":"injection","CWE-284":"auth","CWE-285":"auth",
  "CWE-287":"auth","CWE-288":"auth","CWE-306":"auth","CWE-522":"auth",
  "CWE-787":"memory_corruption","CWE-122":"privesc","CWE-416":"privesc","CWE-121":"memory_corruption",
  "CWE-269":"privesc","CWE-427":"supply_chain","CWE-506":"supply_chain",
  "CWE-601":"phishing","CWE-352":"auth","CWE-862":"auth","CWE-863":"auth",
};

function exploitStatus(isKev,epss){
  if(isKev) return "Active";
  if(epss>.7) return "Likely";
  if(epss>.3) return "Possible";
  return "Theoretical";
}

async function fetchLiveVulns(onProgress){
  /* Primary path: same-origin Cloudflare Function (no CORS issue) — same pattern daily.html uses */
  try{
    onProgress("Fetching from RiskSync intelligence cache...");
    const res = await fetch("/threats");
    if(!res.ok) throw new Error("Function returned "+res.status);
    const data = await res.json();
    if(!data.ok || !data.vulns) throw new Error("Invalid response from /threats");
    onProgress("Live data ready — "+data.count+" CVEs scored from "+(data.kevCount||0).toLocaleString()+" KEV catalogue");
    /* Never trust externally-sourced exploit/type labels — always derive from the same
       canonical logic used everywhere else (kev+epss → exploitStatus; cwe → CWE_TYPE_MAP).
       This is the backend-response equivalent of the curated-data fix: one source of truth. */
    return data.vulns.map(v=>({
      ...v,
      type: v.type || CWE_TYPE_MAP[v.cwe] || "unknown",
      exploit: exploitStatus(v.kev, v.epss||0),
      exploitConfirmedDate: v.exploitConfirmedDate || v.dateAdded,
      cvssEstimated: v.cvssEstimated ?? (v.cvssV == null || v.cvssV === undefined),
    }));
  }catch(cacheErr){
    console.warn("/threats unavailable:", cacheErr.message);
  }

  /* No browser-side fallback. Direct calls would be CORS-blocked in production, and the values they fill in
     (EPSS 0.85 for every KEV entry, default types) would look like real data. Without the live feed the app
     shows clearly marked demo data instead. */
  onProgress("Live feed unavailable — showing demo data");
  return [];
}

      if (!recencyDate(v)) return false;

          </div>
        </div>
      )}

      {/* ANALYZE DETAIL PANEL */}
      {selectedVuln && <ThreatDetailModal vuln={selectedVuln} profile={profile} onClose={()=>setSelectedVuln(null)}/>}
    </div>
  );
}

function TierChip({score,size}){
  const t=scoreTier(score);
  const col=t==="ACT"?C.red:t==="ATTEND"?C.amber:t==="TRACK*"?C.accent:t==="TRACK"?C.green:C.muted;
  return <span style={{fontSize:size||9,fontWeight:700,padding:"1px 7px",borderRadius:3,background:col+"22",color:col,border:`1px solid ${col}44`,whiteSpace:"nowrap"}}>{t}</span>;
}
function DemoBanner({liveVulns}){
  if(liveVulns&&liveVulns.length>0) return null;
  return <div style={{padding:"9px 14px",marginBottom:12,background:C.amberBg,border:`1px solid ${C.amber}55`,borderRadius:8,fontSize:11,color:C.amber}}>Demo data. The live feed is unavailable, so nothing on this page reflects current threats.</div>;
}
function AssumeBanner({S,profile}){
  if(Object.keys(profile.vendors||{}).length>0||!S.assumed) return null;
  return <div style={{padding:"9px 14px",marginBottom:12,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,fontSize:11,color:C.muted}}>{S.assumed.toLocaleString()} items assume the product applies to you because the vendor step was skipped. Edit your profile and list your vendors to sharpen this.</div>;
}
function Kpi({label,value,sub,color}){
  return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 15px",flex:1,minWidth:130}}>

function Panel({title,right,children}){

function urgencyOrder(a,b){ return (b[1].act*100000+b[1].attend*100+b[1].trackStar)-(a[1].act*100000+a[1].attend*100+a[1].trackStar); }

function Simulator({profile,liveVulns}){
  const [patched,setPatched]=useState({});
  const base=(liveVulns&&liveVulns.length>0)?liveVulns:VULNS;
  const S=exposureSummary(profile,base);
  const vendorRows=Object.entries(S.byVendor).filter(([,o])=>o.act+o.attend>0).sort(urgencyOrder).slice(0,15);
  const sum=k=>Object.keys(patched).filter(v=>patched[v]&&S.byVendor[v]).reduce((a,v)=>a+S.byVendor[v][k],0);
  const afterAct=S.act-sum("act"), afterAttend=S.attend-sum("attend");
  const pct=(b,a)=>b>0?Math.round((b-a)/b*100):0;
  const toggle=v=>setPatched(p=>({...p,[v]:!p[v]}));
  const patchTop=n=>{const p={}; vendorRows.slice(0,n).forEach(([v])=>{p[v]=true;}); setPatched(p);};
  return(
    <div className="fadein">
      <DemoBanner liveVulns={liveVulns}/>
      <div style={{fontSize:12,color:C.muted,marginBottom:12,lineHeight:1.6}}>Tick the vendors you would patch and see how many Act and Attend items remain. This only counts your current items. It assumes patching a vendor clears its listed vulnerabilities and does not model new disclosures.</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
        <Kpi label="Act" value={S.act+" → "+afterAct} sub={pct(S.act,afterAct)+"% fewer"} color={C.red}/>
        <Kpi label="Attend" value={S.attend+" → "+afterAttend} sub={pct(S.attend,afterAttend)+"% fewer"} color={C.amber}/>
      </div>
      <Panel title="Vendors with urgent items" right={<span><button onClick={()=>patchTop(3)} style={{fontSize:10,padding:"3px 10px",marginRight:6,borderRadius:4,border:`1px solid ${C.border}`,background:"transparent",color:C.accent,cursor:"pointer"}}>Patch top 3</button><button onClick={()=>setPatched({})} style={{fontSize:10,padding:"3px 10px",borderRadius:4,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,cursor:"pointer"}}>Reset</button></span>}>
        {vendorRows.length===0&&<div style={{fontSize:11,color:C.muted}}>Nothing urgent in your stack.</div>}
        {vendorRows.map(([v,o])=>(
          <label key={v} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:`1px solid ${C.border}`,cursor:"pointer",fontSize:11,color:patched[v]?C.dim:C.text}}>
            <input type="checkbox" checked={!!patched[v]} onChange={()=>toggle(v)}/>
            <span style={{flex:1,textDecoration:patched[v]?"line-through":"none"}}>{v}</span>
            <span style={{color:C.red}}>{o.act} act</span><span style={{color:C.amber}}>{o.attend} attend</span>
          </label>))}
      </Panel>
    </div>
  );
}

function App() {
  const [onboarded, setOnboarded] = useState(false);
  const [profile,   setProfile]   = useState(null);
  const [nav,       setNav]       = useState("dashboard");
  const [activeCategory, setActiveCategory] = useState("all");

  const [liveVulns,  setLiveVulns]  = useState([]);
  const [dataStatus, setDataStatus] = useState({ state:"idle", msg:"", count:0, lastUpdated:null });

  useEffect(() => {
    setDataStatus({ state:"loading", msg:"Initialising...", count:0, lastUpdated:null });
    fetchLiveVulns(msg => setDataStatus(s => ({...s, msg})))
      .then(vulns => {
        if (vulns.length > 0) {
          setLiveVulns(vulns);
          setDataStatus({ state:"live", msg:`${vulns.length} CVEs loaded`, count:vulns.length, lastUpdated:new Date() });
        } else {
          setDataStatus({ state:"fallback", msg:`Using ${VULNS.length} curated CVEs`, count:VULNS.length, lastUpdated:null });
        }
      });
  }, []);

  useEffect(() => {
    const t = setInterval(() => {
      fetchLiveVulns(msg => setDataStatus(s => ({...s, state:"loading", msg})))

/* SSVC-ENGINE-START
   Prioritisation engine. Follows CISA's SSVC decision tree (CISA SSVC Guide, Nov 2022): Table 9 (36 rows) and
   Table 8 (mission and well-being) are encoded verbatim below and covered by tests.
   Three decision points are EVIDENCE and identical for every organisation: exploitation, automatable, technical impact
   (CISA publishes them in the CVE record). One is ORGANISATION-SPECIFIC: mission and well-being, derived from the
   profile (mission prevalence of the affected product + public well-being impact of the sector).
   Output: an urgency tier (Act / Attend / Track* / Track), a score inside that tier's band, and a plain-language
   explanation. Region and scale never move a tier. */
const SSVC_ROWS=[
  ["none","no","partial","low","Track"],["none","no","partial","medium","Track"],["none","no","partial","high","Track"],
  ["none","no","total","low","Track"],["none","no","total","medium","Track"],["none","no","total","high","Track*"],
  ["none","yes","partial","low","Track"],["none","yes","partial","medium","Track"],["none","yes","partial","high","Attend"],
  ["none","yes","total","low","Track"],["none","yes","total","medium","Track"],["none","yes","total","high","Attend"],
  ["poc","no","partial","low","Track"],["poc","no","partial","medium","Track"],["poc","no","partial","high","Track*"],
  ["poc","no","total","low","Track"],["poc","no","total","medium","Track*"],["poc","no","total","high","Attend"],
  ["poc","yes","partial","low","Track"],["poc","yes","partial","medium","Track"],["poc","yes","partial","high","Attend"],
  ["poc","yes","total","low","Track"],["poc","yes","total","medium","Track*"],["poc","yes","total","high","Attend"],
  ["active","no","partial","low","Track"],["active","no","partial","medium","Track"],["active","no","partial","high","Attend"],
  ["active","no","total","low","Track"],["active","no","total","medium","Attend"],["active","no","total","high","Act"],
  ["active","yes","partial","low","Attend"],["active","yes","partial","medium","Attend"],["active","yes","partial","high","Act"],
  ["active","yes","total","low","Attend"],["active","yes","total","medium","Act"],["active","yes","total","high","Act"],
];
const SSVC_MAP={}; SSVC_ROWS.forEach(r=>{SSVC_MAP[r.slice(0,4).join("|")]=r[4];});
const SSVC_MW={
  minimal:  {minimal:"low",    material:"medium", irreversible:"high"},
  support:  {minimal:"medium", material:"medium", irreversible:"high"},
  essential:{minimal:"high",   material:"high",   irreversible:"high"},
};
const SSVC_WB_MATERIAL=["healthcare","energy","manufacturing","logistics","telecom","government","pharma"];
const TIER_RANK={Act:4,Attend:3,"Track*":2,Track:1};
/* "None" = not in your stack: SSVC scores products that are present. A product you do not run is out of scope, so it is listed for awareness at the bottom, never as urgent. */
const TIER_BAND={Act:[8.0,10.0],Attend:[6.0,7.9],"Track*":[4.0,5.9],Track:[2.1,3.9],None:[0.5,2.0]};
const TIER_META={
  Act:     {color:C.red,   bg:C.redBg,    timing:"Remediate as soon as possible. Needs leadership-level attention."},
  Attend:  {color:C.amber, bg:C.amberBg,  timing:"Remediate sooner than your standard update timeline. Needs supervisory attention."},
  "Track*":{color:C.accent,bg:C.accentBg, timing:"Remediate within standard update timelines and watch for changes."},
  Track:   {color:C.green, bg:C.greenBg,  timing:"Remediate within standard update timelines."},
};
function ssvcPoints(v){
  const s=v.ssvc||{};
  return {e:v.kev?"active":(s.e||"none"), a:s.a||"no", t:s.t||"partial", src:s.src||"assumed"};
}
function ssvcWellBeing(profile){
  const pil=profile.techPillars||[];
  const ind=(typeof INDUSTRIES!=="undefined"?INDUSTRIES.find(i=>i.id===profile.industry):null);
  const name=ind?ind.label:(profile.industry||"your sector");
  if((profile.industry==="energy"&&pil.includes("ot_ics"))||(profile.industry==="healthcare"&&pil.includes("iot")))
    return {level:"irreversible",basis:name+" with "+(profile.industry==="energy"?"OT/ICS":"connected medical/IoT devices")+": compromise can cause physical harm"};
  if(SSVC_WB_MATERIAL.includes(profile.industry))
    return {level:"material",basis:name+": compromise can affect safety or essential services"};
  return {level:"minimal",basis:name+": limited public well-being impact"};
}
function vendorLevel(vend,name){
  if(!name) return 0;
  const n=String(name).toLowerCase().trim(); let best=0;
  for(const k in vend){ const kk=String(k).toLowerCase().trim(); if(kk===n||(kk.length>=4&&n.length>=4&&(n.includes(kk)||kk.includes(n)))) best=Math.max(best,vend[k]); }
  return best;
}
function ssvcMission(v,profile){
  const pil=profile.techPillars||[];
  const vend=profile.vendors||{};
  const vendorsDone=Object.keys(vend).length>0;
  const platMatch=pil.some(pid=>(v.affects||[]).includes(pid));
  if(vendorsDone&&v.vendor){
    const lvl=vendorLevel(vend,v.vendor);
    if(lvl===2) return {level:"essential",kind:"declared",basis:"You marked "+v.vendor+" business-critical"};
    if(lvl===1) return {level:"support",kind:"declared",basis:"You use "+v.vendor};
    return {level:"none",kind:"declared",basis:v.vendor+" is not in your vendor list, so it is listed for awareness only"};
  }
  if(v.kev&&v.platKnown===false) return {level:"support",kind:"assumed",basis:"Product not classified, so assumed to apply. Add your vendors to sharpen this."};
  if(platMatch) return {level:"support",kind:"platform",basis:"Matches a platform you run"};
  return {level:"none",kind:"platform",basis:"Does not match a platform you run, so it is listed for awareness only"};
}
function ssvcAssess(v,profile){
  const points=ssvcPoints(v), mission=ssvcMission(v,profile), wellBeing=ssvcWellBeing(profile);
  const notInStack=mission.level==="none";
  const mw=notInStack?"n/a":SSVC_MW[mission.level][wellBeing.level];
  const tier=notInStack?"Track":SSVC_MAP[[points.e,points.a,points.t,mw].join("|")];
  const w=Math.min(1,Math.max(0,.5*(v.epss||0)+.3*((v.cvss||0)/10)+.1*(v.ransomware?1:0)+.1*(mission.level==="essential"?1:0)));
  const band=notInStack?TIER_BAND.None:TIER_BAND[tier];
  return {tier,notInStack,points,mission,wellBeing,mw,weight:w,score:parseFloat((band[0]+w*(band[1]-band[0])).toFixed(1))};
}
function computeVulnScore(v,profile){
  if(!profile||!profile.industry) return v.cvss;
  return ssvcAssess(v,profile).score;
}
function ssvcExplain(v,profile){
  const A=ssvcAssess(v,profile), p=A.points, lines=[], flags=[];
  const srcTag=p.src==="CISA"?" (CISA)":p.src==="derived"?" (derived from the CVSS vector)":" (assumed)";
  lines.push(p.e==="active"?(v.kev?"Confirmed exploited in the wild (CISA KEV)":"Exploited in the wild"):p.e==="poc"?"A public proof of concept exists":"No known exploitation");
  if(v.ransomware) lines.push("Used in ransomware campaigns (CISA)");
  lines.push("Technical impact: "+(p.t==="total"?"total control or disclosure":"partial")+srcTag);
  lines.push("Exploitation "+(p.a==="yes"?"can":"cannot")+" be reliably automated"+srcTag);
  lines.push(A.mission.basis);
  if(!A.notInStack){ lines.push("Sector: "+A.wellBeing.basis); lines.push("Mission and well-being for you: "+A.mw); }
  if(v.cvssEstimated) flags.push("CVSS is an estimate");

/* Which date makes an entry "recent": a KEV entry became urgent when CISA added it; anything else when it was published. */
function recencyDate(v){ return (v.kev&&v.dateAdded)?v.dateAdded:v.publishedDate; }

function getTop10Vulns(profile, vulnList, n=25){
  const list = vulnList && vulnList.length > 0 ? vulnList : VULNS;
  return list
    .map(v=>{const A=(profile&&profile.industry)?ssvcAssess(v,profile):null; return {...v,contextScore:A?A.score:v.cvss,_tier:A?A.tier:null,_notInStack:A?A.notInStack:false,_w:A?A.weight:0};})
    .sort((a,b)=>{
      if(b.contextScore !== a.contextScore) return b.contextScore - a.contextScore;
      if(b._w !== a._w) return b._w - a._w;
      /* Tie-break — meaningful order among threats that tie on score (common once many
         CVEs saturate the 10.0 ceiling at live scale): confirmed exploitation first,
         then higher exploit probability, then most recently disclosed. */
      const bKev=b.kev?1:0, aKev=a.kev?1:0;
      if(bKev !== aKev) return bKev - aKev;
      const bEpss=b.epss||0, aEpss=a.epss||0;
      if(bEpss !== aEpss) return bEpss - aEpss;
      const bd=recencyDate(b)?new Date(recencyDate(b)).getTime():0;
      const ad=recencyDate(a)?new Date(recencyDate(a)).getTime():0;
      return bd - ad;
    })
    .slice(0,n);
}

/* ── NEW SINCE — chronological freshness, separate purpose from priority ranking above.

   Honest limitation: only includes entries with a real publishedDate — nothing is guessed. */
function getNewSince(profile, vulnList, hours=48, cap=25){
  const cutoff = Date.now() - hours*3600000;
  const list = vulnList && vulnList.length > 0 ? vulnList : VULNS;
  return list
    .filter(v=>recencyDate(v) && new Date(recencyDate(v)).getTime() > cutoff)
    .map(v=>({...v,contextScore:computeVulnScore(v,profile)}))
    .sort((a,b)=> new Date(recencyDate(b)).getTime() - new Date(recencyDate(a)).getTime())
    .slice(0,cap);
}

/* ── REMEDIATION vs ADVISORY classification ──

   ("see the vendor bulletin") rather than an actual fix — that's an
   Advisory, not a Remediation, regardless of which tier it came from.
   Curated entries (VULN_REMEDIATION) are hand-written to be specific
   (real patch/hotfix versions) so they're always genuine remediation.
   Type templates are generic guidance by construction — always Advisory. */
function classifyAction(text){
  if(!text) return 'advisory';
  const hasVersion = /\b\d+(\.\d+){1,3}\b/.test(text);
  const genericPointer = /see the vendor bulletin|per vendor instructions|as they become available|discontinue use of the product/i.test(text);
  return (hasVersion && !genericPointer) ? 'remediation' : 'advisory';
}

      ? `${tmpl.urgencyBase} promptly — exploitation reported likely (EPSS ${Math.round((vuln.epss||0)*100)}%)`
      : `${tmpl.urgencyBase} per your standard SLA for this severity — no confirmed active exploitation yet`;
  return {steps:tmpl.steps, urgency, curated:false, source:"Standard for vulnerability type", category:"advisory"};
}

/* ── EXTERNAL REFERENCE LINKS ──
   NVD, MITRE and CISA links are deterministic — always shown when the id looks like a real CVE.
   Any real NVD reference links the vuln carries (vendor advisories, patches, exploit writeups)
   are appended after — however many actually exist, not capped at a fixed set. */
function getReferenceLinks(vuln){
  const links = [];
  const isCve = vuln.id && vuln.id.startsWith("CVE-");
  if(isCve){
    links.push({label:"NVD Details", url:`https://nvd.nist.gov/vuln/detail/${vuln.id}`});
    links.push({label:"MITRE", url:`https://cve.mitre.org/cgi-bin/cvename.cgi?name=${vuln.id}`});
  }
  links.push({label: vuln.kev ? "CISA KEV Catalog" : "CISA Advisories", url: vuln.kev
    ? "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    : "https://www.cisa.gov/news-events/cybersecurity-advisories"});
  (vuln.advisoryUrls||[]).forEach((u,i)=>links.push({label:"Vendor advisory"+((vuln.advisoryUrls.length>1)?" "+(i+1):""), url:u}));
  (vuln.references||[]).forEach(ref=>{
    if(!ref || !ref.url) return;
    const tag = (ref.tags && ref.tags[0]) || "Reference";
    links.push({label: tag, url: ref.url});
  });
  return links;
}

/* ── CATEGORY → THREAT TYPE MAPPING ── */


function filterByCategory(vulnList, catId) {
  if (!catId || catId === "all") return vulnList;
  return vulnList.filter(v => (v.type||"unknown") === catId);
}
</script>

<script>
(function(){
  if(typeof Babel === 'undefined'){ window._rsErr('Babel CDN failed to load. Check internet connection.'); return; }
  if(typeof React === 'undefined'){ window._rsErr('React CDN failed to load.'); return; }
  var opts = {presets:['react'], sourceType:'script'};
  var ids  = ['c1','c2','c3','c4','c5','c6defs','c7'];
  var code = '';
  for(var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if(!el){ window._rsErr('Chunk '+ids[i]+' missing'); return; }
    try{
      var compiled = Babel.transform(el.textContent, opts).code;
      code += '\n' + compiled.replace(/"use strict";?\s*/g,'');
    }catch(e){ window._rsErr('Compile error in '+ids[i]+': '+e.message); return; }
  }
  try{
    (0,eval)(code);
  }catch(e){ window._rsErr('Runtime error: '+e.message+'<br><pre>'+e.stack+'</pre>'); return; }
  try{
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  }catch(e){ window._rsErr('Render error: '+e.message+'<br><pre>'+e.stack+'</pre>'); }
})();
</script>
